name: CI

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dev deps
        run: |
          pip install "black==24.3.0" "ruff==0.4.4" "mypy==1.8.0"

      - name: black
        run: black --check src/ tests/

      - name: ruff
        run: ruff check src/ tests/

      - name: mypy
        run: mypy src/mobiorigin/ --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          # Install CPU-only torch to avoid large downloads in CI
          poetry config virtualenvs.create false
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          poetry install --no-interaction --with dev

      - name: Enforce MobiOrigin critical-core coverage
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: >-
          pytest tests/unit/test_mobiorigin_production.py -q -o addopts=""
          --cov=mobiorigin --cov-report=term --cov-fail-under=80

  install-smoke:
    name: CPU installation & database-environment solve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create the documented CPU runtime
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          post-cleanup: all

      - name: Verify installed commands and CPU-only runtime
        shell: micromamba-shell {0}
        run: |
          mobiorigin --help
          diamond version
          python -c 'import numpy, pyrodigal, torch; assert numpy.__version__ == "1.26.4"; assert torch.version.cuda is None; print(numpy.__version__, torch.__version__)'
          bash -n scripts/setup_mobiorigin_databases.sh

      - name: Verify the isolated MOB-suite environment can be solved
        shell: bash
        run: micromamba create --dry-run --yes --file environment.mob-database.yml
