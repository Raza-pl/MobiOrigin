name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag to build and publish
        required: true
        type: string

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build and verify tagged distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify tag and package version
        shell: bash
        run: |
          case "$RELEASE_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release ref must be an exact vMAJOR.MINOR.PATCH tag" >&2; exit 1 ;;
          esac
          test "$(git tag --points-at HEAD --list "$RELEASE_REF")" = "$RELEASE_REF"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag_version = os.environ["RELEASE_REF"].removeprefix("v")
          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = metadata["tool"]["poetry"]["version"]
          if package_version != tag_version:
              raise SystemExit(
                  f"Tag/package mismatch: {tag_version!r} != {package_version!r}"
              )
          print(f"PASS: exact release version {package_version}")
          PY

      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*

      - name: Enforce the PyPI per-file limit
        run: |
          python - <<'PY'
          from pathlib import Path

          limit = 100_000_000
          distributions = sorted(Path("dist").iterdir())
          if not distributions:
              raise SystemExit("No distributions were built")
          oversized = []
          for path in distributions:
              size = path.stat().st_size
              print(f"{path.name}: {size / 1_000_000:.3f} MB")
              if size > limit:
                  oversized.append((path.name, size))
          if oversized:
              detail = ", ".join(f"{name}={size} bytes" for name, size in oversized)
              raise SystemExit(f"PyPI 100 MB per-file limit exceeded: {detail}")
          print("PASS: all distributions are within the PyPI per-file limit")
          PY

      - name: Store verified distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions-${{ env.RELEASE_REF }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mobiorigin
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions-${{ env.RELEASE_REF }}
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
