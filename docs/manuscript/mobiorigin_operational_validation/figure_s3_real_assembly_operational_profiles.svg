-anchor="end" class="axis">1.0</text><rect x="662.7" y="542.0" width="24" height="38.0" fill="#005F73"/><rect x="686.7" y="120.6" width="24" height="459.4" fill="#B8C4CE"/><text x="686.7" y="602" text-anchor="end" transform="rotate(-45 686.7 602)" class="label">MobiOrigin</text><rect x="736.0" y="573.2" width="24" height="6.8" fill="#005F73"/><rect x="760.0" y="110.0" width="24" height="470.0" fill="#B8C4CE"/><text x="760.0" y="602" text-anchor="end" transform="rotate(-45 760.0 602)" class="label">geNomad</text><rect x="809.3" y="417.9" width="24" height="162.1" fill="#005F73"/><rect x="833.3" y="110.0" width="24" height="470.0" fill="#B8C4CE"/><text x="833.3" y="602" text-anchor="end" transform="rotate(-45 833.3 602)" class="label">PlasClass</text><rect x="882.7" y="491.7" width="24" height="88.3" fill="#005F73"/><rect x="906.7" y="285.5" width="24" height="294.5" fill="#B8C4CE"/><text x="906.7" y="602" text-anchor="end" transform="rotate(-45 906.7 602)" class="label">PlasFlow v1</text><rect x="956.0" y="575.0" width="24" height="5.0" fill="#005F73"/><rect x="980.0" y="110.0" width="24" height="470.0" fill="#B8C4CE"/><text x="980.0" y="602" text-anchor="end" transform="rotate(-45 980.0 602)" class="label">PLASMe</text><rect x="1029.3" y="578.7" width="24" height="1.3" fill="#005F73"/><rect x="1053.3" y="110.0" width="24" height="470.0" fill="#B8C4CE"/><text x="1053.3" y="602" text-anchor="end" transform="rotate(-45 1053.3 602)" class="label">Platon</text><rect x="675" y="132" width="18" height="18" fill="#005F73"/><text x="700" y="147" class="label">Plasmid call fraction</text><rect x="870" y="132" width="18" height="18" fill="#B8C4CE"/><text x="895" y="147" class="label">Prediction coverage</text><text x="60" y="690" class="note">No ground truth was assigned to these assemblies. Runtime, call fraction, coverage, agreement, and evidence tiers are operational—not accuracy or clinical-risk—measurements.</text></svg>
