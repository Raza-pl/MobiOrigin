<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>Real-assembly operational profiles of MobiOrigin and five comparators</title><desc>Panel A shows mean end-to-end runtime on a logarithmic scale. Panel B shows plasmid call fraction and prediction coverage. These are label-free operational measurements, not accuracy.</desc><rect width="1200" height="720" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202A}.title{font-size:24px;font-weight:700}.axis{font-size:15px}.label{font-size:14px}.panel{font-size:20px;font-weight:700}.note{font-size:14px;fill:#455A64}.grid{stroke:#D5DBDB;stroke-width:1}.frame{stroke:#263238;stroke-width:1.5;fill:none}</style><text x="60" y="45" class="title">Real-assembly operational validation (two deterministic subsets)</text><text x="60" y="86" class="panel">A</text><text x="105" y="86" class="axis">Mean end-to-end runtime (seconds; log scale)</text><rect x="105" y="110" width="440" height="470" class="frame"/><line x1="105" y1="580.0" x2="545" y2="580.0" class="grid"/><text x="93" y="585.0" text-anchor="end" class="axis">10</text><line x1="105" y1="462.5" x2="545" y2="462.5" class="grid"/><text x="93" y="467.5" text-anchor="end" class="axis">100</text><line x1="105" y1="345.0" x2="545" y2="345.0" class="grid"/><text x="93" y="350.0" text-anchor="end" class="axis">1,000</text><line x1="105" y1="227.5" x2="545" y2="227.5" class="grid"/><text x="93" y="232.5" text-anchor="end" class="axis">10,000</text><line x1="105" y1="110.0" x2="545" y2="110.0" class="grid"/><text x="93" y="115.0" text-anchor="end" class="axis">100,000</text><rect x="117.7" y="504.4" width="48" height="75.6" fill="#005F73"/><text x="141.7" y="497.4" text-anchor="middle" class="label">44</text><text x="141.7" y="602" text-anchor="end" transform="rotate(-45 141.7 602)" class="label">MobiOrigin</text><rect x="191.0" y="396.7" width="48" height="183.3" fill="#0A9396"/><text x="215.0" y="389.7" text-anchor="mi