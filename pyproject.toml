[tool.poetry]
name = "mobiorigin"
version = "0.1.2"
description = "MobiOrigin: sequence-and-marker classification of bacterial replicons"
authors = ["Shahbaz Raza <shahbaz.invincible3182@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"
include = [
    { path = "src/mobiorigin/data/models/dev1/*.pt", format = ["sdist", "wheel"] },
    { path = "src/mobiorigin/data/models/dev1/*.npy", format = ["sdist", "wheel"] },
    { path = "src/mobiorigin/data/models/dev1/model_manifest.json", format = ["sdist", "wheel"] },
    { path = "src/mobiorigin/data/examples/demo.fasta", format = ["sdist", "wheel"] },
    { path = "src/mobiorigin/data/examples/annotated_assembly_example.fasta", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist"] },
    { path = "CITATION.cff", format = ["sdist"] },
    { path = "CHANGELOG.md", format = ["sdist"] },
    { path = "docs/MOBIORIGIN_DATABASE_SETUP.md", format = ["sdist"] },
    { path = "docs/MOBIORIGIN_OUTPUT_SCHEMA.md", format = ["sdist"] },
    { path = "docs/MOBIORIGIN_ANNOTATION.md", format = ["sdist"] },
    { path = "docs/INSTALLATION_AND_TUTORIAL.md", format = ["sdist"] },
    { path = "environment.yml", format = ["sdist"] },
    { path = "install.sh", format = ["sdist"] },
    { path = "environment.mob-database.yml", format = ["sdist"] },
    { path = "environment.marker-build.yml", format = ["sdist"] },
    { path = "scripts/setup_mobiorigin_databases.sh", format = ["sdist"] },
    { path = "scripts/run_mobiorigin_assembly_example.sh", format = ["sdist"] },
    { path = "src/mobiorigin/marker_database_builder.py", format = ["sdist"] },
    { path = "docs/RELEASE_NOTES_0.1.0.md", format = ["sdist"] },
    { path = "docs/RELEASE_NOTES_0.1.1.md", format = ["sdist"] },
    { path = "docs/RELEASE_NOTES_0.1.2.md", format = ["sdist"] },
    { path = "docs/validation/external_validation", format = ["sdist"] },
    { path = "docs/validation/operational_validation", format = ["sdist"] },
]
homepage = "https://github.com/Raza-pl/MobiOrigin"
repository = "https://github.com/Raza-pl/MobiOrigin"
keywords = ["bioinformatics", "plasmid", "phage", "replicon", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"

# Frozen model and feature runtime
torch = ">=2.0.0,<2.6"
numpy = ">=1.24.0"
pyrodigal = ">=3.0.0"

[tool.poetry.group.webapp]
optional = true

[tool.poetry.group.webapp.dependencies]
# Optional web interface — install with: pip install streamlit
# or: conda install -c conda-forge streamlit
streamlit = ">=1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
black = ">=24.0.0"
ruff = ">=0.1.0"
mypy = ">=1.8.0"
pre-commit = ">=3.6.0"

[tool.poetry.scripts]
mobiorigin = "mobiorigin.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mobiorigin --cov-report=term-missing --cov-fail-under=80"
