[tool.poetry]
name = "mobiorigin"
version = "0.1.0"
description = "MobiOrigin: sequence-and-marker classification of bacterial replicons"
authors = ["Shahbaz Raza <shahbaz.invincible3182@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"
include = [
    { path = "src/mobiorigin/data/models/dev1/*.pt", format = ["sdist", "wheel"] },
    { path = "src/mobiorigin/data/models/dev1/*.npy", format = ["sdist", "wheel"] },
    { path = "src/mobiorigin/data/models/dev1/model_manifest.json", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist"] },
    { path = "CITATION.cff", format = ["sdist"] },
    { path = "CHANGELOG.md", format = ["sdist"] },
    { path = "docs/MOBIORIGIN_DATABASE_SETUP.md", format = ["sdist"] },
    { path = "docs/MOBIORIGIN_OUTPUT_SCHEMA.md", format = ["sdist"] },
    { path = "docs/MOBIORIGIN_MIGRATION.md", format = ["sdist"] },
    { path = "docs/PUBLICATION_AND_RELEASE_CHECKLIST.md", format = ["sdist"] },
    { path = "docs/RELEASE_NOTES_0.1.0.md", format = ["sdist"] },
    { path = "docs/manuscript/MOBIORIGIN_MANUSCRIPT_DRAFT.md", format = ["sdist"] },
    { path = "docs/manuscript/mobiorigin_external_validation", format = ["sdist"] },
]
homepage = "https://github.com/Raza-pl/MobiOrigin"
repository = "https://github.com/Raza-pl/MobiOrigin"
keywords = ["bioinformatics", "plasmid", "phage", "replicon", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"

# Frozen model and feature runtime
torch = ">=2.0.0,<2.6"
numpy = ">=1.24.0"
pyrodigal = ">=3.0.0"

[tool.poetry.group.webapp]
optional = true

[tool.poetry.group.webapp.dependencies]
# Optional web interface — install with: pip install streamlit
# or: conda install -c conda-forge streamlit
streamlit = ">=1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
black = ">=24.0.0"
ruff = ">=0.1.0"
mypy = ">=1.8.0"
pre-commit = ">=3.6.0"
ipykernel = ">=6.29.0"
# Historical PlasFlow2 source-tree tests; excluded from the MobiOrigin wheel.
scikit-learn = ">=1.5.0"
scipy = ">=1.11.0"
biopython = ">=1.82"
click = ">=8.1.0"
tqdm = ">=4.66.0"
plotly = ">=5.18.0"
jinja2 = ">=3.1.0"
pandas = ">=2.1.0"
h5py = ">=3.10.0"
xgboost = ">=2.0.0"

[tool.poetry.scripts]
mobiorigin = "mobiorigin.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_return_any = false
warn_unused_configs = true
# Pipeline and CLI have many pre-existing type issues from optional chaining
# and dynamic field access; suppress until a dedicated type-annotation pass
[[tool.mypy.overrides]]
module = [
    "plasflow2.pipeline",
    "plasflow2.cli",
    "plasflow2.classify.predict",
    "plasflow2.classify.features",
    "plasflow2.classify.marker_classifier",
    "plasflow2.annotate.topology",
    "plasflow2.annotate.args",
    "plasflow2.annotate.mobility",
    "plasflow2.report.generator",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=plasflow2 --cov-report=term-missing --cov-fail-under=0"
